name: tournament_app
description: Esports Tournament Manager — BGMI automated leaderboard
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.3.4
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  google_generative_ai: ^0.4.3
  google_mlkit_text_recognition: ^0.13.0   # ← NEW: on-device OCR
  http: ^1.2.1
  image_picker: ^1.1.2
  image_cropper: ^7.0.3
  screenshot: ^3.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  string_similarity: ^2.0.0
  shared_preferences: ^2.2.3
  dartz: ^0.10.1
  permission_handler: ^11.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_dotenv: ^6.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/playstore.png"

  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700